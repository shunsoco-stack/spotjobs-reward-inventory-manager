name: iOS native build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-native.yml"
      - "assets/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ios-native.yml"
      - "assets/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Generate and verify the ephemeral iOS project
        run: npm run ios:add
      - name: Show the Apple toolchain
        run: xcodebuild -version
      - name: Build for a generic iOS Simulator without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/spotjobs-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Confirm the simulator application bundle
        run: test -d "$RUNNER_TEMP/spotjobs-derived-data/Build/Products/Debug-iphonesimulator/App.app"
