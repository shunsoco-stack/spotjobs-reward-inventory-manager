name: iOS native build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-native.yml"
      - "assets/**"
      - "capacitor.config.ts"
      - "e2e/**"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tsconfig.json"
      - "vitest.config.mts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ios-native.yml"
      - "assets/**"
      - "capacitor.config.ts"
      - "e2e/**"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tsconfig.json"
      - "vitest.config.mts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run the same local release preflight used on the release Mac
        run: npm run ios:release-preflight -- --ci-ephemeral
      - name: Publish the preflight evidence
        if: always() && hashFiles('.artifacts/ios-release-preflight.md') != ''
        run: cat .artifacts/ios-release-preflight.md >> "$GITHUB_STEP_SUMMARY"
